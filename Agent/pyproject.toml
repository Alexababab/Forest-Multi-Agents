[project]
name = "agent"
version = "0.1.0"
description = "林草综合防护与应急响应多智能体系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.2.27",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "langgraph>=1.1.6",
    "marker-pdf>=1.10.2",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.3.0",
    "openai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "torch",
    "torchvision",
    "torchaudio",
    "langchain-text-splitters>=1.1.1",
    "streamlit>=1.40.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

# 👑 终极修复：把落后的 cu121 升级到官方最新的 cu126 仓库！
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
